<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouGram Plugins</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14171a;--muted:#5f6b76;--accent:#2563eb;--chip:#e8ecf1;--border:#e2e6eb}
@media (prefers-color-scheme:dark){:root{--bg:#0e1115;--card:#171b21;--text:#e8ebef;--muted:#9aa5b1;--accent:#6ea0ff;--chip:#232932;--border:#262d36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{margin:8px 0 4px;font-size:28px}
.sub{color:var(--muted);margin:0 0 20px}
input[type=search]{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.cat{border:0;border-radius:999px;padding:6px 14px;background:var(--chip);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.cat[aria-pressed=true]{background:var(--accent);color:#fff}
.card{display:flex;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px}
.ico{flex:none;width:64px;height:64px;border-radius:18px;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:600;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.body{min-width:0;flex:1}
.name{font-size:18px;font-weight:600;margin:0}
.id{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);word-break:break-all}
.desc{margin:6px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.btn{display:inline-block;margin-top:10px;padding:8px 18px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<main>
  <h1>YouGram Plugins</h1>
  <p class="sub" id="sub">Загрузка…</p>
  <input type="search" id="q" placeholder="Поиск плагинов" autocomplete="off">
  <div class="cats" id="cats"></div>
  <div id="list"></div>
</main>
<script>
(function () {
  var plugins = [], cat = "", q = "";
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;      // только textContent: данные из манифестов считаются недоверенными
    return e;
  }
  function safeUrl(u) {
    try { var x = new URL(u, location.href); return x.protocol === "https:" ? x.href : null; } catch (e) { return null; }
  }
  function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " МБ" : Math.max(1, Math.round(n / 1024)) + " КБ"; }

  function render() {
    var list = $("list"); list.textContent = "";
    var items = plugins.filter(function (p) {
      var hay = (p.name + " " + p.id + " " + p.description + " " + p.author).toLowerCase();
      return (!cat || p.category === cat) && hay.indexOf(q) !== -1;
    });
    if (!items.length) { list.appendChild(el("div", "empty", "Ничего не найдено")); return; }
    items.forEach(function (p) {
      var card = el("div", "card"), ico = el("div", "ico");
      var iu = p.icon && safeUrl(p.icon);
      if (iu) { var img = document.createElement("img"); img.src = iu; img.alt = ""; img.loading = "lazy"; ico.appendChild(img); }
      else ico.textContent = (p.name || "?").charAt(0).toUpperCase();
      var body = el("div", "body");
      body.appendChild(el("h2", "name", p.name));
      body.appendChild(el("div", "id", p.id));
      if (p.description) body.appendChild(el("p", "desc", p.description));
      var meta = el("div", "meta");
      ["v" + p.version, "API " + p.api, p.author, p.category, size(p.size || 0)].forEach(function (t) { meta.appendChild(el("span", "chip", t)); });
      body.appendChild(meta);
      if (p.permissions && p.permissions.length) {
        var pm = el("div", "meta");
        p.permissions.forEach(function (t) { pm.appendChild(el("span", "chip", t)); });
        body.appendChild(pm);
      }
      var du = safeUrl(p.url);
      if (du) { var a = el("a", "btn", "Скачать .ygplugin"); a.href = du; a.rel = "noopener"; body.appendChild(a); }
      card.appendChild(ico); card.appendChild(body); list.appendChild(card);
    });
  }

  function cats() {
    var box = $("cats"); box.textContent = "";
    var names = [""].concat(Array.from(new Set(plugins.map(function (p) { return p.category; }))).sort());
    names.forEach(function (n) {
      var b = el("button", "cat", n || "Все"); b.type = "button";
      b.setAttribute("aria-pressed", String(n === cat));
      b.onclick = function () { cat = n; cats(); render(); };
      box.appendChild(b);
    });
  }

  $("q").addEventListener("input", function (e) { q = e.target.value.trim().toLowerCase(); render(); });

  fetch("index.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (d) {
    plugins = d.plugins || [];
    $("sub").textContent = "Плагинов: " + plugins.length;
    cats(); render();
  }).catch(function () { $("sub").textContent = "Не удалось загрузить каталог"; });
})();
</script>
</body>
</html>
