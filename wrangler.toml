name = "yougram-plugins"
main = "tools/worker.js"
compatibility_date = "2024-11-01"

# Сайт раздаёт тот же воркер, поэтому /api/* работает с того же домена (нужно для cookie-входа).
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
REPO = "julfy-0/yougram-plugins"
# GitHub-логины через запятую: могут обновлять любые плагины через сайт
ADMINS = "julfy-0"
# Публикация без ручной проверки: off = всё через черновик, updates = обновления сразу, all = всё сразу
AUTO_APPROVE = "off"
# Доверенные разработчики: GitHub-логины через запятую, их плагины публикуются сразу
TRUSTED = "ex1t44,julfy-0"
# Для новых плагинов при AUTO_APPROVE: аккаунту GitHub не меньше стольких дней (иначе ручная проверка)
MIN_ACCOUNT_DAYS = "7"
# Логины через запятую, которым публикация закрыта
BANNED = ""
# Client ID из GitHub -> Settings -> Developer settings -> OAuth Apps (не секрет)
GH_CLIENT_ID = "Ov23libz09WBm1v8rKTg"

# Секреты задаются командой `npx wrangler secret put <ИМЯ>` или в панели Cloudflare:
#   GITHUB_TOKEN, GH_CLIENT_SECRET, SESSION_SECRET

# Хранилище отзывов и жалоб. Создайте: `npx wrangler kv namespace create FEEDBACK` и вставьте выданный id.
[[kv_namespaces]]
binding = "FEEDBACK"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
