name = "yougram-plugins"
main = "tools/worker.js"
compatibility_date = "2024-11-01"

# Сайт раздаёт тот же воркер, поэтому /api/* работает с того же домена (нужно для cookie-входа).
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
REPO = "julfy-0/yougram-plugins"
ADMINS = "julfy-0"
# off = всё через черновик, updates = обновления сразу, all = всё сразу
AUTO_APPROVE = "all"
MIN_ACCOUNT_DAYS = "7"
BANNED = ""
GH_CLIENT_ID = "Ov23libz09WBm1v8rKTg"